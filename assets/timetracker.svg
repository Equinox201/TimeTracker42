<!--
  TimeTracker42 logo, source for assets/timetracker.png.
  Style matches the other project cards: portrait 355x461, near-black card, glossy icon cluster,
  three caption lines. Text uses "DIN Condensed" (macOS); render the PNG on a machine that has it,
  e.g. with Playwright: page.locator("svg").screenshot() at deviceScaleFactor 2.
-->
