name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Public placeholders: the build only needs the variables to exist.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: public-anon-key-placeholder
          VITE_SUPABASE_FUNCTIONS_URL: https://example.functions.supabase.co

  functions:
    name: Edge Functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Unit tests (shared modules)
        run: deno test supabase/functions/_shared/
      - name: Type-check each function
        run: |
          # Check every function, then fail once, so one run lists all problems.
          failed=0
          for dir in supabase/functions/*/; do
            case "$dir" in *_shared*) continue ;; esac
            echo "::group::$dir"
            deno check --config "$dir/deno.json" "$dir/index.ts" || failed=1
            echo "::endgroup::"
          done
          exit $failed

  database:
    name: Database (migrations + RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Start local Supabase (database, auth, API only)
        run: |
          supabase start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Diagnostics (grants after migrations)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -c "select grantee, privilege_type, grantor from information_schema.role_table_grants where table_schema='public' and table_name='profiles' order by 1,2" \
            -c "select pg_get_userbyid(defaclrole) as owner, defaclobjtype, defaclacl from pg_default_acl where defaclnamespace::regnamespace::text = 'public'" \
            -c "select rolname, rolinherit, rolbypassrls from pg_roles where rolname in ('anon','authenticated','service_role','postgres')" \
            -c "select n.nspname, c.relname, pg_get_userbyid(c.relowner) as owner from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='profiles'"
      - name: Run pgTAP tests
        run: supabase test db
