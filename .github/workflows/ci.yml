name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Public placeholders: the build only needs the variables to exist.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: public-anon-key-placeholder
          VITE_SUPABASE_FUNCTIONS_URL: https://example.functions.supabase.co

  e2e:
    name: End-to-end and accessibility (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  functions:
    name: Edge Functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Unit tests (shared modules)
        run: deno test supabase/functions/_shared/
      - name: Type-check each function
        run: |
          # Check every function, then fail once, so one run lists all problems.
          failed=0
          for dir in supabase/functions/*/; do
            case "$dir" in *_shared*) continue ;; esac
            echo "::group::$dir"
            deno check --config "$dir/deno.json" "$dir/index.ts" || failed=1
            echo "::endgroup::"
          done
          exit $failed

  database:
    name: Database (migrations + RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - name: Start local Supabase (database, auth, API only)
        run: |
          supabase start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Run pgTAP tests
        run: supabase test db
